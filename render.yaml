services:
  - type: web
    name: pyrogram-session-manager
    runtime: python
    repo: https://github.com/kingali371/pyrogram-session-manager
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
    buildCommand: pip install -r requirements.txt
    startCommand: python web_interface.py
    autoDeploy: true
